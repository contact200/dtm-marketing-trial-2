name: Validate DTM trial
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/render.py --concept calendar_fills --date 2026-11-23 --visual-mode motion_graphic --no-video --size 360x640 --output outputs/ci
      - run: test -s outputs/ci/cover.jpg && test -s outputs/ci/caption.txt && test -s outputs/ci/payload.json
