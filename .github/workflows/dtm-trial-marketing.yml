name: DateTheMoment Trial Social Studio
on:
  workflow_dispatch:
    inputs:
      concept:
        description: 'Campaign ID or auto'
        required: true
        default: auto
        type: string
      visual_mode:
        description: 'Visual style'
        required: true
        default: auto
        type: choice
        options: [auto, motion_graphic, full_bleed_photo]
      deliver_to_make:
        description: 'Send to trial approval queue'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 15 * * 1,3,5'
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - run: python -m unittest discover -s tests -v
      - run: python scripts/import_photos.py
      - name: Render video, cover, caption and metadata
        env:
          CONCEPT: ${{ inputs.concept || 'auto' }}
          VISUAL_MODE: ${{ inputs.visual_mode || 'auto' }}
        run: python scripts/render.py --concept "$CONCEPT" --visual-mode "$VISUAL_MODE" --size 1080x1920 --fps 24 --seconds 13 --output outputs/latest
      - name: Optional Make approval handoff
        env:
          DTM_TRIAL_SUPABASE_URL: ${{ secrets.DTM_TRIAL_SUPABASE_URL }}
          DTM_TRIAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DTM_TRIAL_SUPABASE_SERVICE_ROLE_KEY }}
          DTM_TRIAL_SUPABASE_BUCKET: ${{ vars.DTM_TRIAL_SUPABASE_BUCKET || 'dtm-trial-2-public' }}
          DTM_TRIAL_MAKE_WEBHOOK_URL: ${{ secrets.DTM_TRIAL_MAKE_WEBHOOK_URL }}
          DTM_TRIAL_DELIVER_TO_MAKE: ${{ (github.event_name == 'workflow_dispatch' && inputs.deliver_to_make) || (github.event_name == 'schedule' && vars.DTM_TRIAL_AUTO_DELIVER_TO_MAKE == 'true') }}
        run: python scripts/deliver.py outputs/latest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtm-trial-social-${{ github.run_number }}
          path: |
            outputs/latest/reel.mp4
            outputs/latest/cover.jpg
            outputs/latest/caption.txt
            outputs/latest/payload.json
            outputs/latest/delivery.json
          if-no-files-found: warn
          retention-days: 21
