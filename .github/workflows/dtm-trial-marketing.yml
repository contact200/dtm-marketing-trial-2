name: DTM Trial 2 · Preview Only (Telegram via main)
on:
  workflow_dispatch:
    inputs:
      concept:
        description: "Campaign ID or auto (Telegram is sent from datethemoment-motion)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - calendar_fills
          - one_match_months
          - club_voice
          - time_saved
          - media_pipeline
          - quiet_cadence
          - moments_live_on
      visual_mode:
        description: "Visual mode"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - motion_graphic
          - full_bleed_photo

permissions:
  contents: read

jobs:
  preview:
    name: Render preview (no duplicate integrations or secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - run: python -m unittest discover -s tests -v
      - run: python scripts/import_photos.py
      - name: Render video, cover, caption and metadata
        env:
          CONCEPT: ${{ inputs.concept || 'auto' }}
          VISUAL_MODE: ${{ inputs.visual_mode || 'auto' }}
        run: python scripts/render.py --concept "$CONCEPT" --visual-mode "$VISUAL_MODE" --sequence "$GITHUB_RUN_NUMBER" --size 1080x1920 --fps 24 --seconds 13 --output outputs/latest
      - name: Explain how to send to Telegram
        run: |
          echo "### Preview only — no duplicate Supabase / Make secrets" >> "$GITHUB_STEP_SUMMARY"
          echo "For video delivery to your existing Make → Telegram review receiver, use the connected workflow:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/contact200/datethemoment-motion/actions/workflows/dtm-trial-2-to-make.yml" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtm-trial-preview-${{ github.run_number }}
          path: |
            outputs/latest/reel.mp4
            outputs/latest/cover.jpg
            outputs/latest/caption.txt
            outputs/latest/payload.json
          if-no-files-found: warn
          retention-days: 21
